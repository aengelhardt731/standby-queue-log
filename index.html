  // Real, boring browser localStorage — tied to this exact URL/origin,
  // survives closing the tab/browser, only clears if you clear site data.
  window.storage = {
    async get(key, shared) {
      const ns = shared ? "shared:" : "personal:";
      const raw = localStorage.getItem(ns + key);
      if (raw === null) throw new Error("Key not found: " + key);
      return { key, value: raw, shared: !!shared };
    },
    async set(key, value, shared) {
      const ns = shared ? "shared:" : "personal:";
      localStorage.setItem(ns + key, value);
      return { key, value, shared: !!shared };
    },
    async delete(key, shared) {
      const ns = shared ? "shared:" : "personal:";
      localStorage.removeItem(ns + key);
      return { key, deleted: true, shared: !!shared };
    },
    async list(prefix, shared) {
      const ns = shared ? "shared:" : "personal:";
      const full = ns + (prefix || "");
      const keys = Object.keys(localStorage).filter((k) => k.startsWith(full)).map((k) => k.slice(ns.length));
      return { keys, prefix, shared: !!shared };
    },
  };
